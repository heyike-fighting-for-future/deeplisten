<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DeepListen 六级英语听力训练：听、写、对照、精读、跟读与背诵。">
  <meta name="robots" content="noindex,nofollow">
  <title>DeepListen 六级听力库</title>
  <style>
    :root{color-scheme:light dark;--bg:#f3f0e9;--surface:#fffdf9;--surface-strong:#fff;--soft:#e9efec;--text:#20312e;--muted:#6f7c78;--line:#d9e1dc;--accent:#2f635b;--accent-hover:#244f49;--accent-soft:#e0ece8;--amber:#c89248;--ok:#3f765c;--ok-soft:#e4efe8;--shadow:0 12px 32px rgba(44,61,55,.08);--shadow-small:0 5px 16px rgba(44,61,55,.06)}
    @media(prefers-color-scheme:dark){:root{--bg:#17201e;--surface:#202a27;--surface-strong:#26312e;--soft:#2b3935;--text:#edf3f0;--muted:#a8b6b1;--line:#3b4b46;--accent:#79b5a9;--accent-hover:#8fc7bc;--accent-soft:#2b4540;--amber:#e1b66f;--ok:#86c49d;--ok-soft:#294438;--shadow:0 12px 32px rgba(0,0,0,.2);--shadow-small:0 5px 16px rgba(0,0,0,.15)}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,rgba(200,146,72,.09),transparent 32rem),linear-gradient(180deg,var(--surface) 0,var(--bg) 23rem);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.65}
    button,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1360px;margin:auto;padding:32px 28px 72px}h1,h2,h3,p{margin-top:0}h1{font-size:28px;line-height:1.2;margin-bottom:2px;letter-spacing:-.025em}h2{font-size:25px;line-height:1.3;margin-bottom:6px;letter-spacing:-.018em}h3{font-size:19px;margin-bottom:6px}.muted{color:var(--muted);font-size:14px}.top,.lesson-head,.between,.overview-head{display:flex;justify-content:space-between;gap:18px;align-items:center}
    .top{padding:8px 4px 20px}.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--accent),var(--accent-hover));box-shadow:0 8px 20px rgba(47,99,91,.22);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:750}.overall{width:280px}.bar{height:9px;background:var(--soft);border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--amber));border-radius:inherit;transition:width .25s ease}
    .library{margin:8px 0 18px;background:linear-gradient(135deg,var(--surface-strong),var(--surface));border:1px solid var(--line);border-radius:18px;padding:19px 22px;box-shadow:var(--shadow-small);display:grid;grid-template-columns:190px minmax(0,1fr) auto;gap:18px;align-items:center}.library select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}.library select:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:24px}.step{min-height:52px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.28);color:var(--muted);text-align:left;padding:10px 12px;font-size:13px;transition:background .18s ease,border-color .18s ease,transform .18s ease}.step:hover{background:var(--surface);transform:translateY(-1px)}.step.active{border-color:var(--accent);background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent);font-weight:750}.step.done{border-color:rgba(63,118,92,.4);background:var(--ok-soft);color:var(--ok)}
    .lesson-head{align-items:flex-end;margin-bottom:18px;padding:0 4px}.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tag,.stage-state{font-size:12px;border-radius:999px;padding:5px 10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
    .panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.stage-layout{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:24px;margin-bottom:34px}.audio-box{min-height:430px;display:flex;flex-direction:column;justify-content:space-between}.audio-title{font-size:40px;font-weight:720;line-height:1.15;letter-spacing:-.04em;margin:16px 0 8px}.countdown{min-height:76px;display:flex;align-items:center;color:var(--accent);font-size:42px;font-weight:720;letter-spacing:-.035em}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:var(--surface-strong);color:var(--text);border-radius:11px;padding:10px 14px;transition:background .16s ease,border-color .16s ease,transform .16s ease,box-shadow .16s ease}.btn:hover{background:var(--soft);border-color:#bdcbc5;transform:translateY(-1px)}.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(47,99,91,.2)}.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}.btn.circle{width:62px;height:62px;border-radius:50%;padding:0;font-size:19px}.seek{margin-top:19px}.seek input{width:100%;height:8px;accent-color:var(--accent);cursor:pointer}.seek-note{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px;margin-top:5px}
    .stage-content{min-height:430px}.stage-content textarea{width:100%;min-height:210px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;font-size:16px;line-height:1.7;outline:none}.stage-content textarea:focus{background:var(--surface-strong);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}.choice-list,.groups{display:grid;gap:12px;margin:15px 0}.choice{display:flex;gap:11px;align-items:center;border:1px solid var(--line);background:var(--surface-strong);border-radius:13px;padding:12px 14px}.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}.group-nav{display:flex;gap:8px;margin:12px 0 15px}.group-nav button{width:40px;height:40px;padding:0}.group-nav .current{background:var(--accent);border-color:var(--accent);color:#fff}.feedback,.copy-box{background:var(--soft);border-radius:13px;padding:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:12px}.copy-box{min-height:130px;font-size:14px;white-space:pre-wrap}.copy-label{color:var(--muted);font-size:12px;margin-bottom:6px}.study-list{padding-left:22px}.study-list li{margin:10px 0}.recording{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.recording audio{max-width:100%}
    .overview-head{align-items:flex-end;margin-bottom:15px;padding:0 4px}.group{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-small);overflow:hidden}.group.active{border-color:var(--accent);box-shadow:0 8px 24px rgba(47,99,91,.12)}.group-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}.play-small{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface-strong);color:var(--accent);font-weight:750}.group-title{font-size:15px;font-weight:700}.transcript{padding:0 18px 18px 84px;font-size:15px;line-height:1.72}.transcript p{margin:0 0 9px}.hidden-copy{color:var(--muted);font-style:italic}.stage-state.done{background:var(--ok-soft);color:var(--ok);border:0}.stage-state.now{background:var(--accent);color:#fff;border:0}.complete{text-align:center;padding:30px 10px}.complete-number{font-size:42px;font-weight:720;color:var(--ok)}.toast{position:fixed;right:24px;bottom:24px;background:var(--text);color:var(--bg);padding:11px 15px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.app{padding:24px 18px 56px}.top,.lesson-head,.overview-head{align-items:stretch;flex-direction:column}.overall{width:100%}.library{grid-template-columns:1fr}.steps{grid-template-columns:repeat(3,1fr)}.stage-layout,.compare{grid-template-columns:1fr}.audio-box,.stage-content{min-height:auto}.transcript{padding-left:18px}.tags{justify-content:flex-start}}
    @media(max-width:560px){.app{padding:18px 12px 44px}h1{font-size:24px}h2{font-size:22px}.mark{width:44px;height:44px}.steps{grid-template-columns:repeat(2,1fr);gap:7px}.step{min-height:46px;padding:8px 10px}.panel{padding:20px;border-radius:18px}.audio-title{font-size:32px}.countdown{font-size:34px;min-height:64px}.btn.circle{width:56px;height:56px}.seek-note{flex-direction:column;gap:2px}.group-row{grid-template-columns:46px minmax(0,1fr)}.group-row .stage-state{grid-column:2}.transcript{padding:0 14px 15px}.library{padding:16px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand"><div class="mark">D</div><div><h1>DeepListen</h1><div class="muted">听 → 写 → 对照 → 精读 → 跟读 → 背诵</div></div></div>
    <div class="overall"><div class="between muted"><span>本篇进度</span><strong id="progressText">0%</strong></div><div class="bar"><span id="progressBar"></span></div></div>
  </header>
  <section class="library">
    <div><strong>选择学习音频</strong><div class="muted">7 篇已下载到本地</div></div>
    <select id="lessonSelect" aria-label="选择学习音频"></select>
    <span class="muted">4 篇 AI · 3 篇足球/曼联延伸</span>
  </section>
  <nav class="steps" id="steps"></nav>
  <section class="lesson-head">
    <div><div class="muted" id="lessonMeta"></div><h2 id="lessonTitle"></h2><div class="muted" id="lessonSource"></div></div>
    <div class="tags"><span class="tag" id="durationTag"></span><span class="tag" id="accentTag"></span><span class="tag">3 组 × 3 段精选稿</span></div>
  </section>
  <section class="stage-layout">
    <div class="panel audio-box">
      <div><div class="muted" id="audioLabel"></div><div class="audio-title" id="audioTitle"></div><p class="muted" id="audioInstruction"></p><div class="countdown" id="countdown">正在载入本地音频…</div></div>
      <div>
        <audio id="realAudio" preload="auto"></audio>
        <div class="controls"><button class="btn primary circle" id="playBtn" aria-label="播放">▶</button><button class="btn" id="rewindBtn">－5 秒</button><button class="btn" id="forwardBtn">＋5 秒</button><button class="btn" id="repeatBtn">从当前位置播放</button><select class="btn" id="speed" aria-label="播放速度"><option value="1">1.0×</option><option value="1.15">1.15×</option><option value="1.25" selected>1.25× 六级建议</option><option value="1.4">1.4×</option><option value="1.5">1.5×</option></select><span class="muted">已播放 <strong id="playCount">0</strong> 次</span></div>
        <div class="seek"><input id="seekRange" type="range" min="0" max="1" step="0.1" value="0"><div class="seek-note"><span id="seekText">0:00 / 0:00</span><span>可拖到任意秒，听写不会消失</span></div></div>
        <div style="margin-top:10px"><div class="bar"><span id="audioBar"></span></div></div>
      </div>
    </div>
    <div class="panel stage-content" id="stageContent"></div>
  </section>
  <section>
    <div class="overview-head"><div><h2>音频、精选文字稿与进度</h2><div class="muted" id="transcriptNote"></div></div><button class="btn" id="revealBtn">浏览全部原文</button></div>
    <div class="groups" id="groups"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="lesson-library.js?v=cet6-20260910"></script>
<script>
const {lessons,getLesson}=window.DeepListenLibrary;
const $=id=>document.getElementById(id);
const stepNames=["完整盲听","三段听写","核对原文","理解精读","跟读模仿","全文背诵"];
let lesson=getLesson(localStorage.getItem("deeplisten-last-lesson"));
let groups=lesson.groups,typed=["","",""];let groupDone=[false,false,false],playCounts=[0,0,0,0];
let stage=0,currentGroup=0,revealAll=false,counting=false,countdownId=null,nativeReady=false,groupLimited=false;
let mediaRecorder=null,chunks=[],recordingUrl="",objectUrl="";

function notify(text){$("toast").textContent=text;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function draftKey(){return `deeplisten-library-draft-${lesson.id}`}
function saveDraft(){const field=$("dictation");if(field)typed[currentGroup]=field.value;try{localStorage.setItem(draftKey(),JSON.stringify({typed,groupDone,stage,currentGroup,playCounts,updatedAt:Date.now()}));localStorage.setItem("deeplisten-last-lesson",lesson.id)}catch(e){}}
function loadDraft(){typed=["","",""];groupDone=[false,false,false];playCounts=[0,0,0,0];stage=0;currentGroup=0;try{const saved=JSON.parse(localStorage.getItem(draftKey())||"null");if(saved){if(Array.isArray(saved.typed))typed=saved.typed.slice(0,3);if(Array.isArray(saved.groupDone))groupDone=saved.groupDone.slice(0,3);if(Array.isArray(saved.playCounts))playCounts=saved.playCounts.slice(0,4);stage=Math.max(0,Math.min(5,Number(saved.stage)||0));currentGroup=Math.max(0,Math.min(2,Number(saved.currentGroup)||0))}}catch(e){}}
function formatSeconds(value){if(!Number.isFinite(value))return"0:00";return`${Math.floor(value/60)}:${String(Math.floor(value%60)).padStart(2,"0")}`}
function startOfGroup(i){return Number.isFinite($("realAudio").duration)?$("realAudio").duration*i/3:0}
function endOfGroup(i){return Number.isFinite($("realAudio").duration)?$("realAudio").duration*(i+1)/3:Infinity}
function progress(){const base=[0,12,50,65,78,90][stage]||0;const value=Math.min(100,base+(stage===1?groupDone.filter(Boolean).length*12:0));$("progressText").textContent=value+"%";$("progressBar").style.width=value+"%"}
function audioMeta(){if(stage===0||stage===5)return["全文音频",stage===0?"完整盲听":"全文背诵"];return[`第 ${currentGroup+1} 组 · 约三分之一音频`,stepNames[stage]]}
function renderHeader(){$("lessonTitle").textContent=lesson.title;$("lessonMeta").textContent=`${lesson.level} · ${lesson.topic==="AI"?"人工智能":"足球 / 曼联兴趣延伸"} · 官方真实录音`;$("lessonSource").innerHTML=`来源：<a href="${lesson.sourceUrl}" target="_blank" rel="noreferrer">${lesson.source}</a> · ${lesson.note}`;$("durationTag").textContent=lesson.durationLabel;$("accentTag").textContent=lesson.accent;$("transcriptNote").textContent="全文按时间分成三组；每组保留三段对照稿，适合反复听写、核对和跟读。"}
function renderSteps(){$("steps").innerHTML=stepNames.map((name,i)=>`<button class="step ${i<stage?"done":i===stage?"active":""}" onclick="goStage(${i})">${i+1}　${name}</button>`).join("")}
function renderAudio(){const meta=audioMeta();$("audioLabel").textContent=meta[0];$("audioTitle").textContent=meta[1];$("audioInstruction").textContent=stage===1?"可以一边听一边写；暂停、拖动、重播都不会清空文字。":stage===4?"拖动到任意位置，反复模仿语速、重音和停顿。":stage===5?"先自由复习，再尝试独立背诵。":"播放前有 3 秒倒计时，然后播放真实 VOA 音频。";$("playCount").textContent=playCounts[stage===0||stage===5?3:currentGroup]}
function groupButtons(){return`<div class="group-nav">${groups.map((_,i)=>`<button class="btn ${i===currentGroup?"current":""}" onclick="chooseGroup(${i})">${i+1}</button>`).join("")}</div>`}
function norm(s){return s.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).filter(Boolean)}
function score(a,b){const x=norm(a),y=norm(b),bag={};y.forEach(w=>bag[w]=(bag[w]||0)+1);let hit=0;x.forEach(w=>{if(bag[w]){hit++;bag[w]--}});return y.length?Math.min(100,Math.round(hit/y.length*100)):0}
function escapeHTML(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function stageHTML(){
 if(stage===0)return`<h3>第一次只听大意</h3><p class="muted">不看文字稿，不追求听懂每个词。</p><div class="choice-list">${["听懂不到 30%","大约听懂一半","听懂大部分","几乎完全听懂"].map((x,i)=>`<label class="choice"><input type="radio" name="gist" value="${i}">${x}</label>`).join("")}</div><textarea id="gistNote" placeholder="写下主题和你听到的关键词……"></textarea><div class="between"><span></span><button class="btn primary" onclick="finishBlind()">完成盲听，开始听写</button></div>`;
 if(stage===1)return`<h3>第 ${currentGroup+1} 组听写</h3><p class="muted">本组播放约三分之一的完整音频。听不出的地方先留空。</p>${groupButtons()}<textarea id="dictation" placeholder="Type everything you hear...">${escapeHTML(typed[currentGroup])}</textarea><div class="between"><button class="btn" onclick="firstWord()">三个首词提示</button><button class="btn primary" onclick="finishGroup()">保存这一组</button></div>`;
 if(stage===2)return`<h3>核对听写结果</h3><p class="muted">精选稿不与音频逐句切齐，匹配率只作参考；重点找出熟词听不出和连读弱读。</p>${groupButtons()}<div class="feedback">第 ${currentGroup+1} 组词汇匹配约 <strong>${score(typed[currentGroup],groups[currentGroup].join(" "))}%</strong></div><div class="compare"><div><div class="copy-label">你的听写</div><div class="copy-box">${escapeHTML(typed[currentGroup]||"未填写")}</div></div><div><div class="copy-label">精选原文</div><div class="copy-box">${groups[currentGroup].join(" ")}</div></div></div><div style="margin-top:12px;text-align:right"><button class="btn primary" onclick="goStage(3)">进入精读</button></div>`;
 if(stage===3)return`<h3>只学最重要的内容</h3><p class="muted">把注意力放在能复用的词组和表达上。</p><ul class="study-list">${lesson.study.map(item=>`<li>${item}</li>`).join("")}</ul><div style="text-align:right"><button class="btn primary" onclick="goStage(4)">进入跟读</button></div>`;
 if(stage===4)return`<h3>跟随真实音频模仿</h3><p class="muted">先听当前组，再按相同节奏朗读；需要时可录音回听。</p>${groupButtons()}<div class="recording"><button class="btn primary" id="recordBtn" onclick="toggleRecording()">开始录音</button><span class="muted" id="recordState">尚未录音</span></div>${recordingUrl?`<audio controls src="${recordingUrl}"></audio>`:""}<div style="text-align:right"><button class="btn primary" onclick="goStage(5)">进入背诵</button></div>`;
 return`<div class="complete"><h3>最后一步：全文背诵</h3><p class="muted">先播放原音复习，再隐藏文字稿，用自己的话尽可能完整地复述。</p><button class="btn" onclick="toggleReveal()">${revealAll?"隐藏精选稿":"临时查看精选稿"}</button><div class="recording" style="justify-content:center"><button class="btn primary" onclick="toggleRecording()">录制背诵</button><span class="muted" id="recordState">准备后开始</span></div><div class="complete-number" id="completeMark">90%</div><button class="btn primary" onclick="completeLesson()">完成整篇训练</button></div>`
}
function renderContent(){$("stageContent").innerHTML=stageHTML();const field=$("dictation");if(field)field.addEventListener("input",e=>{typed[currentGroup]=e.target.value;saveDraft()})}
function renderGroups(){$("groups").innerHTML=groups.map((group,i)=>{const visible=revealAll||groupDone[i]||stage>=2;return`<article class="group ${i===currentGroup&&stage>0&&stage<5?"active":""}"><div class="group-row"><button class="play-small" onclick="chooseAndPlay(${i})">▶</button><div><div class="group-title">第 ${i+1} 组 · 连续音频 + 3 段精选稿</div><div class="muted">约 ${formatSeconds(startOfGroup(i))}—${formatSeconds(endOfGroup(i))} · 可自由拖动</div></div><span class="stage-state ${groupDone[i]?"done":i===currentGroup&&stage===1?"now":""}">${groupDone[i]?"听写完成":i===currentGroup&&stage===1?"当前":"未完成"}</span></div><div class="transcript ${visible?"":"hidden-copy"}">${visible?group.map((s,n)=>`<p><strong>${i*3+n+1}.</strong> ${s}</p>`).join(""):"完成这一组听写后显示精选文字稿"}</div></article>`}).join("")}
function updateTimeline(){const audio=$("realAudio"),duration=Number.isFinite(audio.duration)?audio.duration:0;$("seekRange").max=String(duration||1);$("seekRange").value=String(audio.currentTime||0);$("seekText").textContent=`${formatSeconds(audio.currentTime)} / ${formatSeconds(duration)}`;$("audioBar").style.width=`${duration?audio.currentTime/duration*100:0}%`}
function render(){renderHeader();renderSteps();renderAudio();renderContent();renderGroups();progress();$("revealBtn").textContent=revealAll?"隐藏未完成原文":"浏览全部原文";updateTimeline()}
function stopAudio(message="已暂停，可拖动后继续"){if(countdownId){clearInterval(countdownId);countdownId=null;counting=false}$("realAudio").pause();$("playBtn").textContent="▶";$("countdown").textContent=message;updateTimeline()}
function startAudio(withCountdown=true){saveDraft();if(!nativeReady){notify("音频仍在载入，请稍候");return}if(!withCountdown){$("realAudio").play().catch(()=>notify("请再次点击播放"));return}if(counting)return;counting=true;let n=3;$("countdown").textContent=n;countdownId=setInterval(()=>{n--;if(n>0){$("countdown").textContent=n;return}clearInterval(countdownId);countdownId=null;counting=false;const key=stage===0||stage===5?3:currentGroup;playCounts[key]++;$("playCount").textContent=playCounts[key];saveDraft();$("realAudio").play().catch(()=>notify("请再次点击播放"))},1000)}
async function loadAudio(){const audio=$("realAudio");nativeReady=false;stopAudio("正在载入本地音频…");try{const localAudio=lesson.audio.replace(/^\/files\//,"./");const response=await fetch(localAudio);if(!response.ok)throw new Error();const buffer=await response.arrayBuffer();if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([buffer],{type:"audio/mpeg"}));audio.src=objectUrl;audio.playbackRate=Number($("speed").value);audio.load()}catch(e){$("countdown").textContent="音频载入失败，请刷新页面"}}
function switchLesson(id){saveDraft();stopAudio("正在切换课程…");lesson=getLesson(id);groups=lesson.groups;revealAll=false;groupLimited=false;recordingUrl="";loadDraft();localStorage.setItem("deeplisten-last-lesson",lesson.id);render();loadAudio()}
function goStage(i){saveDraft();stopAudio("已切换训练步骤");stage=i;groupLimited=stage>0&&stage<5;if(stage>1)groupDone.fill(true);const audio=$("realAudio");audio.currentTime=stage===0||stage===5?0:startOfGroup(currentGroup);render();saveDraft()}
function chooseGroup(i){saveDraft();stopAudio("已切换音频组");currentGroup=i;groupLimited=true;$("realAudio").currentTime=startOfGroup(i);render();saveDraft()}
function chooseAndPlay(i){chooseGroup(i);startAudio(true)}
function finishBlind(){if(!document.querySelector('input[name="gist"]:checked')){notify("先选择大致听懂程度");return}goStage(1)}
function finishGroup(){const field=$("dictation");typed[currentGroup]=field?field.value:typed[currentGroup];if(!typed[currentGroup].trim()){notify("请先写下这一组听到的内容");return}groupDone[currentGroup]=true;notify(`第 ${currentGroup+1} 组已保存`);if(currentGroup<2)chooseGroup(currentGroup+1);else goStage(2)}
function firstWord(){notify(groups[currentGroup].map(s=>s.split(" ")[0]).join(" · "))}
function toggleReveal(){revealAll=!revealAll;render()}
function completeLesson(){$("completeMark").textContent="100%";$("progressText").textContent="100%";$("progressBar").style.width="100%";notify("本篇训练已完成")}
async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];mediaRecorder=new MediaRecorder(stream);mediaRecorder.ondataavailable=e=>chunks.push(e.data);mediaRecorder.onstop=()=>{if(recordingUrl)URL.revokeObjectURL(recordingUrl);recordingUrl=URL.createObjectURL(new Blob(chunks,{type:"audio/webm"}));stream.getTracks().forEach(t=>t.stop());renderContent();notify("录音完成，可以回听")};mediaRecorder.start();if($("recordState"))$("recordState").textContent="正在录音……";if($("recordBtn"))$("recordBtn").textContent="停止录音"}catch(e){notify("需要允许麦克风权限才能录音")}}

$("lessonSelect").innerHTML=lessons.map((item,i)=>`<option value="${item.id}">${i+1}. [${item.topic==="AI"?"AI":"足球"}] ${item.title}</option>`).join("");$("lessonSelect").value=lesson.id;$("lessonSelect").addEventListener("change",e=>switchLesson(e.target.value));
$("playBtn").addEventListener("click",()=>$("realAudio").paused?startAudio(true):stopAudio());$("repeatBtn").addEventListener("click",()=>startAudio(false));$("rewindBtn").addEventListener("click",()=>{saveDraft();$("realAudio").currentTime=Math.max(0,$("realAudio").currentTime-5);updateTimeline()});$("forwardBtn").addEventListener("click",()=>{saveDraft();$("realAudio").currentTime=Math.min($("realAudio").duration||0,$("realAudio").currentTime+5);updateTimeline()});$("seekRange").addEventListener("input",e=>{saveDraft();$("realAudio").currentTime=Number(e.target.value);updateTimeline()});$("speed").addEventListener("change",e=>$("realAudio").playbackRate=Number(e.target.value));$("revealBtn").addEventListener("click",toggleReveal);
$("realAudio").addEventListener("loadedmetadata",()=>{nativeReady=true;$("countdown").textContent="真实音频已就绪";updateTimeline();renderGroups()});$("realAudio").addEventListener("play",()=>{$("playBtn").textContent="■";$("countdown").textContent="正在播放，可同时继续听写"});$("realAudio").addEventListener("pause",()=>{$("playBtn").textContent="▶"});$("realAudio").addEventListener("timeupdate",()=>{updateTimeline();if(groupLimited&&$("realAudio").currentTime>=endOfGroup(currentGroup)){stopAudio("本组播放结束");$("realAudio").currentTime=endOfGroup(currentGroup)}});$("realAudio").addEventListener("ended",()=>{$("countdown").textContent="全文播放结束"});$("realAudio").addEventListener("error",()=>{$("countdown").textContent="音频解码失败，请刷新页面"});window.addEventListener("beforeunload",saveDraft);
loadDraft();render();loadAudio();
</script>
</body>
</html>
